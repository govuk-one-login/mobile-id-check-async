AWSTemplateFormatVersion: "2010-09-09"

Resources:
  PutSessionFunction:
    DependsOn:
      - PutSessionFunctionLogGroup
    Type: AWS::Serverless::Function
    Metadata:
      checkov:
        skip:
          - id: "CKV_AWS_116"
            comment: "Not needed for test resources."
          - id: "CKV_AWS_173"
            comment: "AWS-managed key used to encrypt environment variables by default is sufficient."
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: false
        EntryPoints:
          - src/functions/sessions/putSessionHandler.ts
        Format: esm
        Platform: node
        OutExtension:
          - .js=.mjs
        Banner:
          - js=import { createRequire } from 'module'; const require = createRequire(import.meta.url);
    Properties:
      Description: Lambda for putting items into the Sessions table
      Events:
        PutSession:
          Type: Api
          Properties:
            Path: /sessions/{sessionId}
            Method: put
            RestApiId: !Ref TestResourcesApi
      FunctionName: !Sub ${AWS::StackName}-sessions      
      Handler: putSessionHandler.lambdaHandler
      Timeout: 5
      Role: !GetAtt PutSessionFunctionRole.Arn
      VpcConfig:
        SubnetIds:
          - Fn::ImportValue:
              !Sub ${VpcStackName}-PrivateSubnetIdA
          - Fn::ImportValue:
              !Sub ${VpcStackName}-PrivateSubnetIdB
          - Fn::ImportValue:
              !Sub ${VpcStackName}-PrivateSubnetIdC
        SecurityGroupIds:
          - Fn::ImportValue:
              !Sub ${VpcStackName}-AWSServicesEndpointSecurityGroupId

  PutSessionFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_158
            comment: KMS encryption not required as log group will not contain sensitive data.
    Properties:
      RetentionInDays: 7
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-sessions

  PutSessionFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Execution role for the test sessions handler
      RoleName: !Sub ${AWS::StackName}-sessions
      PermissionsBoundary: !If
        - UsePermissionsBoundary
        - !Ref PermissionsBoundary
        - !Ref AWS::NoValue
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: VpcPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ec2:DescribeNetworkInterfaces
                  - ec2:CreateNetworkInterface
                  - ec2:DeleteNetworkInterface
                Resource: '*'
        - PolicyName: LoggingPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: arn:aws:logs:*:*:*